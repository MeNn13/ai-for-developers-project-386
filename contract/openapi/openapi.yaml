openapi: 3.0.0
info:
  title: Booking Calendar API
  description: API сервиса бронирования календаря.
  version: 0.0.0
tags:
  - name: health
paths:
  /api/health:
    get:
      operationId: getHealth
      description: Проверяет, что API отвечает.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      tags:
        - health
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Признак того, что API отвечает.
      description: Состояние API.
      example:
        status: ok
servers:
  - url: http://127.0.0.1:5000
    description: Локальная разработка
    variables: {}
