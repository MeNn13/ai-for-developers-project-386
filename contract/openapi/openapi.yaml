openapi: 3.0.0
info:
  title: Booking Calendar API
  description: API сервиса бронирования календаря.
  version: 0.0.0
tags:
  - name: health
  - name: meeting-types
  - name: slots
  - name: meetings
paths:
  /api/health:
    get:
      operationId: getHealth
      description: Проверяет, что API отвечает.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      tags:
        - health
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: Возвращает типы встреч в порядке создания; новый тип — в конце списка.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
      tags:
        - meeting-types
    post:
      operationId: createMeetingType
      description: Создаёт тип встречи и возвращает созданный тип.
      parameters: []
      responses:
        '201':
          description: Тип встречи создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: Поля запроса не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Id с недопустимыми символами и длительность вне диапазона.
                  value:
                    type: validation-failed
                    title: Запрос некорректен
                    status: 400
                    detail: Поля запроса не прошли проверку.
                    instance: /api/meeting-types
                    errors:
                      id:
                        - Разрешены только строчные латинские буквы, цифры и дефис
                      durationMinutes:
                        - Длительность должна быть от 15 до 480 минут
        '409':
          description: Тип встречи с таким id уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Повторное создание типа с тем же id.
                  value:
                    type: meeting-type-exists
                    title: Конфликт
                    status: 409
                    detail: Тип встречи с таким id уже существует.
                    instance: /api/meeting-types
      tags:
        - meeting-types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeCreateRequest'
  /api/meetings:
    post:
      operationId: createMeeting
      description: Создаёт встречу на свободном слоте и возвращает её; конец вычисляется из длительности типа.
      parameters: []
      responses:
        '201':
          description: Встреча создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          description: Поля запроса не прошли проверку.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ProblemDetails'
                  - $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Старт в прошлом, вне сетки, окна или рабочих часов.
                  value:
                    type: slot-not-bookable
                    title: Слот недоступен
                    status: 400
                    detail: Это время не является слотом записи.
                    instance: /api/meetings
                example1:
                  description: Пустое имя гостя и время без смещения.
                  value:
                    type: validation-failed
                    title: Запрос некорректен
                    status: 400
                    detail: Поля запроса не прошли проверку.
                    instance: /api/meetings
                    errors:
                      guestName:
                        - Поле «Ваше имя» обязательно
                      start:
                        - Время начала должно быть в формате ISO 8601 со смещением
        '404':
          description: Тип встречи с таким id не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Неизвестный meetingTypeId.
                  value:
                    type: meeting-type-not-found
                    title: Не найдено
                    status: 404
                    detail: Тип встречи с таким id не найден.
                    instance: /api/meetings
        '409':
          description: Слот уже занят другой встречей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Интервал пересекается с существующей встречей.
                  value:
                    type: slot-taken
                    title: Слот занят
                    status: 409
                    detail: Это время уже занято другой встречей.
                    instance: /api/meetings
      tags:
        - meetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreateRequest'
    get:
      operationId: listMeetings
      description: Возвращает предстоящие встречи по возрастанию начала; пусто — пустой список.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meeting'
      tags:
        - meetings
  /api/slots:
    get:
      operationId: listSlots
      description: Возвращает снимок слотов выбранного типа встречи на 14 дней вперёд.
      parameters:
        - name: meetingTypeId
          in: query
          required: true
          description: Идентификатор типа встречи, для которого считаются слоты.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SlotsResponse'
        '400':
          description: Поля запроса не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Запрос без обязательного параметра meetingTypeId.
                  value:
                    type: validation-failed
                    title: Запрос некорректен
                    status: 400
                    detail: Параметр meetingTypeId обязателен.
                    instance: /api/slots
                    errors:
                      meetingTypeId:
                        - Параметр «meetingTypeId» обязателен
        '404':
          description: Тип встречи с таким id не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Неизвестный meetingTypeId.
                  value:
                    type: meeting-type-not-found
                    title: Не найдено
                    status: 404
                    detail: Тип встречи с таким id не найден.
                    instance: /api/slots
      tags:
        - slots
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Признак того, что API отвечает.
      description: Состояние API.
      example:
        status: ok
    Meeting:
      type: object
      required:
        - id
        - meetingTypeId
        - meetingTypeTitle
        - durationMinutes
        - start
        - end
        - guestName
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор встречи.
        meetingTypeId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор типа встречи, по которому забронирована встреча.
        meetingTypeTitle:
          type: string
          minLength: 1
          maxLength: 120
          description: Название типа встречи на момент брони.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 480
          multipleOf: 5
          description: Длительность встречи на момент брони, в минутах.
        start:
          type: string
          format: date-time
          description: Начало встречи по московскому времени.
        end:
          type: string
          format: date-time
          description: 'Конец встречи по московскому времени: начало плюс длительность.'
        guestName:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя гостя, указанное при бронировании.
      description: 'Встреча: занятый интервал с типом на момент брони и именем гостя.'
      example:
        id: 6f9619ff-8b86-d011-b42d-00cf4fc964ff
        meetingTypeId: znakomstvo
        meetingTypeTitle: Знакомство
        durationMinutes: 30
        start: '2026-11-02T10:00:00+03:00'
        end: '2026-11-02T10:30:00+03:00'
        guestName: Анна
    MeetingCreateRequest:
      type: object
      required:
        - meetingTypeId
        - start
        - guestName
      properties:
        meetingTypeId:
          type: string
          minLength: 1
          maxLength: 64
          description: Идентификатор типа встречи.
        start:
          type: string
          format: date-time
          description: Начало встречи в формате ISO 8601 со смещением; сервер приводит время к Москве.
        guestName:
          type: string
          minLength: 1
          maxLength: 100
          description: Имя гостя.
      description: Запрос на бронирование встречи; конец сервер вычисляет из длительности типа.
      example:
        meetingTypeId: znakomstvo
        start: '2026-11-02T10:00:00+03:00'
        guestName: Анна
    MeetingType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-]+$
          description: Короткий идентификатор типа встречи.
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Название типа встречи.
        description:
          type: string
          maxLength: 500
          description: Описание для гостя; пустая строка допустима.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 480
          multipleOf: 5
          description: Длительность встречи в минутах.
      description: 'Тип встречи: шаблон с названием, описанием и длительностью.'
      example:
        id: znakomstvo
        title: Знакомство
        description: Короткий первый созвон.
        durationMinutes: 30
    MeetingTypeCreateRequest:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-]+$
          description: Короткий идентификатор типа встречи.
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Название типа встречи.
        description:
          type: string
          maxLength: 500
          description: Описание для гостя; пустая строка допустима.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 480
          multipleOf: 5
          description: Длительность встречи в минутах.
      description: Запрос на создание типа встречи.
      example:
        id: znakomstvo
        title: Знакомство
        description: Короткий первый созвон.
        durationMinutes: 30
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          enum:
            - validation-failed
            - slot-not-bookable
            - meeting-type-not-found
            - not-found
            - meeting-type-exists
            - slot-taken
          description: Короткий slug ошибки.
        title:
          type: string
          description: Краткий заголовок ошибки для человека.
        status:
          type: integer
          format: int32
          description: HTTP-код ответа.
        detail:
          type: string
          description: Понятное описание ошибки для человека.
        instance:
          type: string
          description: Путь запроса, на котором произошла ошибка.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Сообщения по полям; присутствует только у ошибки validation-failed.
      description: Описание ошибки в формате RFC 7807 Problem Details.
      example:
        type: not-found
        title: Не найдено
        status: 404
        detail: Запрошенный маршрут API не существует.
        instance: /api/meeting-types
    Slot:
      type: object
      required:
        - start
        - end
        - available
      properties:
        start:
          type: string
          format: date-time
          description: Начало слота по московскому времени.
        end:
          type: string
          format: date-time
          description: 'Конец слота: начало плюс длительность типа встречи.'
        available:
          type: boolean
          description: 'Свободен ли слот: true — можно бронировать, false — пересекается со встречей.'
      description: 'Слот: интервал, который начинается в точке сетки стартов и длится столько же, сколько выбранный тип встречи.'
      example:
        start: '2026-11-02T10:00:00+03:00'
        end: '2026-11-02T10:30:00+03:00'
        available: true
    SlotDay:
      type: object
      required:
        - date
        - slots
      properties:
        date:
          type: string
          format: date
          description: Дата дня в формате YYYY-MM-DD.
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          description: Слоты дня по возрастанию начала.
      description: День окна записи со слотами выбранного типа; у выходного дня и дня без кандидатов массив пуст.
      example:
        date: '2026-11-02'
        slots:
          - start: '2026-11-02T10:00:00+03:00'
            end: '2026-11-02T10:30:00+03:00'
            available: true
    SlotWindow:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date
          description: Первый день окна — сегодня по московскому времени.
        to:
          type: string
          format: date
          description: Последний день окна — сегодня плюс 13 дней.
      description: Границы окна записи.
      example:
        from: '2026-11-02'
        to: '2026-11-15'
    SlotsResponse:
      type: object
      required:
        - timezone
        - window
        - days
      properties:
        timezone:
          type: string
          description: Часовой пояс, в котором отданы даты и время.
        window:
          allOf:
            - $ref: '#/components/schemas/SlotWindow'
          description: Границы окна записи.
        days:
          type: array
          items:
            $ref: '#/components/schemas/SlotDay'
          description: Ровно 14 дней по возрастанию даты, включая выходные и дни без кандидатов.
      description: Снимок слотов на 14 дней вперёд для выбранного типа встречи.
      example:
        timezone: Europe/Moscow
        window:
          from: '2026-11-02'
          to: '2026-11-15'
        days:
          - date: '2026-11-02'
            slots:
              - start: '2026-11-02T10:00:00+03:00'
                end: '2026-11-02T10:30:00+03:00'
                available: true
              - start: '2026-11-02T10:30:00+03:00'
                end: '2026-11-02T11:00:00+03:00'
                available: false
          - date: '2026-11-03'
            slots: []
servers:
  - url: http://127.0.0.1:5000
    description: Локальная разработка
    variables: {}
