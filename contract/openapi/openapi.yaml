openapi: 3.0.0
info:
  title: Booking Calendar API
  description: API сервиса бронирования календаря.
  version: 0.0.0
tags:
  - name: health
  - name: meeting-types
paths:
  /api/health:
    get:
      operationId: getHealth
      description: Проверяет, что API отвечает.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      tags:
        - health
  /api/meeting-types:
    get:
      operationId: listMeetingTypes
      description: Возвращает типы встреч в порядке создания; новый тип — в конце списка.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MeetingType'
      tags:
        - meeting-types
    post:
      operationId: createMeetingType
      description: Создаёт тип встречи и возвращает созданный тип.
      parameters: []
      responses:
        '201':
          description: Тип встречи создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingType'
        '400':
          description: Поля запроса не прошли проверку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Id с недопустимыми символами и длительность вне диапазона.
                  value:
                    type: validation-failed
                    title: Запрос некорректен
                    status: 400
                    detail: Поля запроса не прошли проверку.
                    instance: /api/meeting-types
                    errors:
                      id:
                        - Разрешены только строчные латинские буквы, цифры и дефис
                      durationMinutes:
                        - Длительность должна быть от 15 до 480 минут
        '409':
          description: Тип встречи с таким id уже существует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              examples:
                example0:
                  description: Повторное создание типа с тем же id.
                  value:
                    type: meeting-type-exists
                    title: Конфликт
                    status: 409
                    detail: Тип встречи с таким id уже существует.
                    instance: /api/meeting-types
      tags:
        - meeting-types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingTypeCreateRequest'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
          description: Признак того, что API отвечает.
      description: Состояние API.
      example:
        status: ok
    MeetingType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-]+$
          description: Короткий идентификатор типа встречи.
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Название типа встречи.
        description:
          type: string
          maxLength: 500
          description: Описание для гостя; пустая строка допустима.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 480
          multipleOf: 5
          description: Длительность встречи в минутах.
      description: 'Тип встречи: шаблон с названием, описанием и длительностью.'
      example:
        id: znakomstvo
        title: Знакомство
        description: Короткий первый созвон.
        durationMinutes: 30
    MeetingTypeCreateRequest:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9-]+$
          description: Короткий идентификатор типа встречи.
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Название типа встречи.
        description:
          type: string
          maxLength: 500
          description: Описание для гостя; пустая строка допустима.
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 480
          multipleOf: 5
          description: Длительность встречи в минутах.
      description: Запрос на создание типа встречи.
      example:
        id: znakomstvo
        title: Знакомство
        description: Короткий первый созвон.
        durationMinutes: 30
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          enum:
            - validation-failed
            - slot-not-bookable
            - meeting-type-not-found
            - not-found
            - meeting-type-exists
            - slot-taken
          description: Короткий slug ошибки.
        title:
          type: string
          description: Краткий заголовок ошибки для человека.
        status:
          type: integer
          format: int32
          description: HTTP-код ответа.
        detail:
          type: string
          description: Понятное описание ошибки для человека.
        instance:
          type: string
          description: Путь запроса, на котором произошла ошибка.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Сообщения по полям; присутствует только у ошибки validation-failed.
      description: Описание ошибки в формате RFC 7807 Problem Details.
      example:
        type: not-found
        title: Не найдено
        status: 404
        detail: Запрошенный маршрут API не существует.
        instance: /api/meeting-types
servers:
  - url: http://127.0.0.1:5000
    description: Локальная разработка
    variables: {}
