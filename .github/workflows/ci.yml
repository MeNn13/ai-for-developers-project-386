name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # A new advisory can fail the build without any change on our side.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.10.12'

      - name: Trust mise config
        run: mise trust

      - name: Install dependencies
        run: mise run install

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Check commit messages on main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from "$BEFORE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}

      - name: Run checks
        run: mise run check

  # Slow scans that read the network or the whole git history. They do not
  # need the dependencies installed, and they also run on a schedule.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: '2026.10.12'

      - name: Trust mise config
        run: mise trust

      - name: Audit dependencies and history
        run: mise run check:audit
